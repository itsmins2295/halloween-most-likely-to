<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#201327"><title>Most Likely To... 🎃</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#fff1f5;background:#160e1d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#4a2146,#160e1d 65%);padding:25px 16px}main{max-width:980px;margin:0 auto}.eyebrow{color:#ffb96e;text-transform:uppercase;letter-spacing:.22em;font-weight:800;font-size:.75rem;text-align:center}h1{text-align:center;font-size:clamp(2.5rem,6vw,5.5rem);line-height:1.02;margin:14px 0;color:#fff5ec;text-shadow:0 7px 30px #0007}.intro{text-align:center;color:#d3b9d4;margin-bottom:30px}.panel{background:#2b1b33e8;border:1px solid #755377;border-radius:22px;padding:clamp(20px,3.6vw,38px);box-shadow:0 25px 75px #0004}.center{text-align:center}.hide{display:none!important}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.btn,.choice{font:inherit;border:1px solid #bd7ab2;border-radius:13px;padding:15px 18px;background:#61365f;color:white;font-weight:750;cursor:pointer;min-height:52px}.btn.primary{background:#f1a953;color:#271222;border-color:#f8c78e}.btn.secondary{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.choice{background:#372540}.choice:hover,.btn:hover:not(:disabled){filter:brightness(1.2)}input{width:100%;padding:16px;border-radius:12px;background:#170e1c;border:1px solid #a87ca6;color:white;font:inherit;margin:8px 0 12px}.muted{color:#c5afc9}.tiny{font-size:.8rem}.question{text-align:center;font-weight:850;font-size:clamp(1.8rem,4.5vw,3.6rem);line-height:1.18;max-width:800px;margin:25px auto}.tag{text-align:center;text-transform:uppercase;color:#ffbc77;letter-spacing:.16em;font-size:.75rem;font-weight:800}.flex{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.qr{width:min(280px,70vw);border-radius:16px;display:block;margin:15px auto}.code{font-size:clamp(2.4rem,5vw,4.5rem);letter-spacing:.17em;font-weight:900;color:#ffbe7e}.players{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.pill{padding:8px 14px;border:1px solid #745678;border-radius:100px;background:#3e2945}.barline{display:flex;justify-content:space-between;margin-top:18px}.barbg{height:16px;background:#1a1020;border-radius:30px;overflow:hidden;margin-top:6px}.bar{height:100%;background:linear-gradient(90deg,#c56f9a,#f5ac64);border-radius:30px}.resultwrap{max-width:690px;margin:auto}.status{text-align:center;margin:15px auto;color:#f4be86;font-weight:750}.hostonly{margin-top:18px}.footer{text-align:center;margin-top:30px;color:#a793ac;font-size:.8rem}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f0b16e;color:#271528;padding:12px 19px;border-radius:12px;display:none;max-width:90vw;text-align:center;font-weight:750}@media(min-width:1000px){body.hostmode .question{font-size:4vw}body.hostmode .panel{min-height:390px}}
</style></head><body><main><p class="eyebrow">🎃 The Halloween Party Game 🎃</p><h1>MOST LIKELY TO...</h1><p class="intro">Accuse your friends. Vote secretly. Reveal the chaos.</p><section class="panel" id="app"></section><p class="footer">One vote per guest, per round • No login required • Host reveals results</p></main><div id="toast"></div><script src="/socket.io/socket.io.js"></script><script>
const sock=io({reconnection:true}), app=document.getElementById('app');let game=null, role='';const params=new URLSearchParams(location.search);let room=params.get('room')||sessionStorage.getItem('halloweenRoom')||'',secret=sessionStorage.getItem('halloweenSecret')||'',playerId=localStorage.getItem('halloweenPlayer_'+room)||'',guestName=localStorage.getItem('halloweenName_'+room)||'',votedRound=-1;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(message.timeout);message.timeout=setTimeout(()=>e.style.display='none',3500)}function emit(event,data,callback){sock.emit(event,data,r=>{if(r?.error)message(r.error);callback?.(r)})}function btn(text,action,style='primary'){return `<button class="btn ${style}" onclick="${action}">${text}</button>`}
function initial(){if(secret&&room){role='host';document.body.classList.add('hostmode');emit('host_rejoin',{code:room,secret},r=>{if(!r?.ok){sessionStorage.clear();role='';room='';draw()}})}else if(room){role='guest';draw();if(playerId&&guestName)join(true)}else draw()}
function draw(){if(!game){app.innerHTML=room&&!secret?`<div class="center"><h2>Join the Halloween party</h2><p>Room <strong>${esc(room)}</strong></p><input id="guestname" placeholder="Your first name" maxlength="24" value="${esc(guestName)}"><button class="btn primary" onclick="join(false)">Join game →</button></div>`:`<div class="center"><h2>Ready to expose your friends?</h2><p class="muted">Set up a party on the big screen. Guests join from their own phones.</p>${btn('Create a Game','create()')}<p class="muted">Or join with a game code:</p><input id="roominput" placeholder="6-character room code" maxlength="6"><button class="btn secondary" onclick="enterCode()">Join an existing game</button></div>`;return}
const isHost=role==='host',mine=game.players.find(p=>p.id===playerId),question=`<div class="tag">Round ${game.round+1} / ${game.total}</div><div class="question">${esc(game.question)}</div>`;
if(game.phase==='lobby'){app.innerHTML=`<div class="center"><div class="tag">Party lobby</div>${isHost?`<h2>Scan to join!</h2><img class="qr" src="/api/qr/${game.code}" alt="QR code to join"><div class="code">${game.code}</div><p class="muted">Or go to <strong>${esc(location.host)}</strong> and enter this code</p>`:`<h2>You're in${mine?', '+esc(mine.name):''}! 👻</h2><p class="muted">Waiting for the host to begin...</p>`}<h3>${game.players.length} guests joined</h3><div class="players">${game.players.map(p=>`<span class="pill">${esc(p.name)}</span>`).join('')}</div>${isHost?`<div class="hostonly">${btn('Start voting →',"action('start')")}</div>`:''}</div>`;return}
if(game.phase==='voting'){const voted=votedRound===game.round;app.innerHTML=question+(isHost?`<div class="center"><h2>Voting is open 👀</h2><p class="status">${game.votesCount} of ${game.players.length} votes in</p><p class="muted">Guests vote privately on their phones.</p>${btn('Reveal results 👻',"action('reveal')")}</div>`:voted?`<div class="center"><h2>Vote locked! 🔒</h2><p class="muted">Waiting for the host to reveal the results.</p><p>${game.votesCount} / ${game.players.length} voted</p></div>`:`<div class="center"><p class="muted">${mine?'Pick your suspect, '+esc(mine.name):'Join the game first'} — one secret vote!</p><div class="choices">${game.players.map(p=>`<button class="choice" onclick="vote('${p.id}')">${esc(p.name)}</button>`).join('')}</div></div>`);return}
if(game.phase==='results'){const rows=game.results||[],top=rows[0]?.votes||0,winners=rows.filter(r=>r.votes===top&&top>0).map(r=>r.name);app.innerHTML=question+`<div class="center"><div class="tag">The group has spoken</div><h2>🏆 ${esc(winners.length?winners.join(' & '):'No votes yet')}</h2><p class="muted">${winners.length>1?'We have a tie!':'Officially exposed.'}</p></div><div class="resultwrap">${rows.map(r=>`<div class="barline"><strong>${esc(r.name)}</strong><span>${r.votes} vote${r.votes===1?'':'s'}</span></div><div class="barbg"><div class="bar" style="width:${game.votesCount?r.votes/game.votesCount*100:0}%"></div></div>`).join('')}</div>${isHost?`<div class="center hostonly">${btn(game.round+1>=game.total?'Finish game':'Next round →',"action('next')")}</div>`:''}`;return}
app.innerHTML=`<div class="center"><h2>🎉 You survived all ${game.total} rounds!</h2><p>Friendships may never recover.</p>${isHost?btn('Play again','action(\'restart\')'):''}</div>`;
}
function create(){emit('create',{},r=>{if(!r?.ok)return;room=r.code;secret=r.secret;role='host';sessionStorage.setItem('halloweenRoom',room);sessionStorage.setItem('halloweenSecret',secret);history.replaceState({},'',`/?room=${room}&host=1`);document.body.classList.add('hostmode')})}function enterCode(){room=document.getElementById('roominput').value.trim().toUpperCase();if(!room)return message('Enter a room code');history.replaceState({},'',`/?room=${room}`);role='guest';playerId=localStorage.getItem('halloweenPlayer_'+room)||'';guestName=localStorage.getItem('halloweenName_'+room)||'';draw()}function join(auto){const name=auto?guestName:document.getElementById('guestname')?.value.trim();if(!name)return message('Enter your name');emit('join',{code:room,name,playerId},r=>{if(!r?.ok)return;role='guest';playerId=r.playerId;guestName=name;localStorage.setItem('halloweenPlayer_'+room,playerId);localStorage.setItem('halloweenName_'+room,guestName)})}function vote(targetId){emit('vote',{code:room,playerId,targetId},r=>{if(r?.ok){votedRound=game.round;draw()}})}function action(a){emit('host_action',{code:room,secret,action:a})}
sock.on('state',s=>{if(s.code!==room)return;if(game&&s.round!==game.round)votedRound=-1;game=s;draw()});sock.on('connect',()=>{if(role==='host'&&secret&&room)emit('host_rejoin',{code:room,secret});else if(role==='guest'&&playerId&&guestName)join(true)});initial();
</script></body></html>
